<html lang="en">
<head>
  <meta charset="utf-8">

  <title>stillpeer</title>
  <style>
    /* The page opens dark (light ink on dark paper) and turns light as you
       scroll down. --tone is the scroll progress: 0 at the top, 1 when done. */
    :root {
      --tone: 0;
      --paper-dark: #161513;
      --ink-dark: #f1ece2;
      --spark-dark: #f4cb55;
      --paper-light: #faf7f0;
      --ink-light: #1f1d1a;
      --spark-light: #e2a922;
      --paper: color-mix(in oklab, var(--paper-light) calc(var(--tone) * 100%), var(--paper-dark));
      --ink: color-mix(in oklab, var(--ink-light) calc(var(--tone) * 100%), var(--ink-dark));
      --spark: color-mix(in oklab, var(--spark-light) calc(var(--tone) * 100%), var(--spark-dark));
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: clip; }
    /* A tall scroll track; the word stays pinned in view while the colors turn. */
    .scene { height: 250vh; }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    h1 { margin: 0; width: min(88vw, 960px); }
    .word { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; }
    .glyph { fill: var(--ink); }
    .pen { fill: none; stroke: #fff; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }

    /* Shine: a band of light sweeps across the letters once the word is done. */
    #sheen stop { stop-color: var(--spark); }
    .sheen rect { fill: url(#sheen); transform: translateX(-90px); }
    .shine .sheen rect { animation: sweep 1500ms cubic-bezier(.45, 0, .25, 1) forwards; }
    @keyframes sweep { to { transform: translateX(400px); } }

    /* Sparkles: bursts of short lines shooting out in every direction, popping
       along with the sweep; a few burst again now and then afterwards. */
    .ray {
      fill: none; stroke: var(--spark); stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0;
    }
    .shine .ray { animation: burst 750ms var(--delay) cubic-bezier(.2, .7, .3, 1) both; }
    .shine .again .ray {
      animation: burst 750ms var(--delay) cubic-bezier(.2, .7, .3, 1) both,
                 burst-again var(--every) calc(var(--delay) + 1500ms) cubic-bezier(.2, .7, .3, 1) infinite;
      animation-fill-mode: both, none;
    }
    @keyframes burst {
      0%   { stroke-dashoffset: 1; opacity: 0; }
      10%  { opacity: 1; }
      50%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @keyframes burst-again {
      0%, 82% { stroke-dashoffset: 1; opacity: 0; }
      84%     { opacity: 1; }
      91%     { stroke-dashoffset: 0; opacity: 1; }
      100%    { stroke-dashoffset: -1; opacity: 0; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>

    const shift = (strokes, dx) => strokes.map(s => s.map(([x, y]) => [x + dx, y]));
    const L = [[[121.5, -53], [120.5, -45], [119, -35], [118.5, -25], [118.3, -15], [118.5, -8], [120.5, -3.5], [125, -4.5]]];
    const E = [[[220, -15.5], [229, -17], [237, -18.5], [244, -21], [247, -26], [244, -31.5], [236, -33], [228, -30.5], [222.5, -23], [221.5, -14], [224, -6], [231, -1], [239, -1], [245, -4], [250, -7.5]]];
    const STROKES = [
      // s
      [[[30, -32], [24, -34.5], [16, -35], [10, -33], [7, -28.5], [8.5, -23.5], [15, -20], [23, -17], [28, -12.5], [27.5, -6.5], [22, -2], [14, -1.5], [7, -3], [2, -5]]],
      // t — stem with the foot, then the cross
      [[[57.5, -53], [56.5, -45], [55.5, -33], [55.2, -20], [55.5, -11], [57.5, -6], [62, -3.5], [66.5, -4.5]],
       [[44, -31], [50, -32.8], [58, -33.8], [65, -34], [69.5, -34]]],
      // i — stem, then the dot
      [[[89.5, -29], [89, -22], [88.3, -14], [88, -8], [88, -4.5]],
       [[87.5, -46.5], [91, -45.5], [93, -44]]],
      L,
      shift(L, 30.2),
      // p — stem down, then the bowl
      [[[178, -31], [177.8, -20], [177.8, -6], [178, 6], [177.8, 18]],
       [[178.5, -24.5], [184, -29], [193, -30], [200, -27.5], [203, -20], [201, -12], [194, -7], [186, -5], [180, -4.5]]],
      E,
      shift(E, 47.8),
      // r — stem, then the shoulder
      [[[320.5, -31], [320.8, -20], [321, -10], [321.3, -3]],
       [[321.5, -22], [325, -27], [330, -31], [336, -31], [340, -29.5]]],
    ];

    // Sparkle bursts: [x, y, size, bursts again every n ms or 0].
    const SPARKS = [
      [-7, -39, 8, 0], [75, -52, 10, 4600], [135, -66, 8, 0], [165, 15, 7, 0],
      [258, -50, 11, 3800], [311, 13, 7, 0], [355, -42, 10, 5200],
    ];

    const START_DELAY = 500;   // ms before the pen touches the paper
    const MS_PER_UNIT = 6;     // pen speed (higher is slower)
    const STROKE_GAP = 120;    // pen lift inside a letter
    const LETTER_GAP = 150;    // pause between letters

    const NS = 'http://www.w3.org/2000/svg';
    const el = (name, attrs) => {
      const node = document.createElementNS(NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      return node;
    };

    // Smooth curve through the points (Catmull-Rom as cubic Béziers).
    function smooth(pts) {
      let d = `M${pts[0]}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const [p0, p1, p2, p3] = [pts[i - 1] || pts[i], pts[i], pts[i + 1], pts[i + 2] || pts[i + 1]];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1} ${c2} ${p2}`;
      }
      return d;
    }

    const svg = document.querySelector('.word');
    const defs = svg.querySelector('defs');
    const ink = svg.querySelector('.ink');
    const sparkles = svg.querySelector('.sparkles');

    const letters = GLYPHS.map(({ d }, i) => {
      const mask = el('mask', { id: `pen-${i}`, maskUnits: 'userSpaceOnUse', x: -20, y: -80, width: 400, height: 120 });
      const pens = STROKES[i].map(points => {
        const pen = el('path', { d: smooth(points), class: 'pen' });
        mask.appendChild(pen);
        const length = pen.getTotalLength();
        pen.style.strokeDasharray = `${length} ${length + 1}`;
        return { pen, length };
      });
      defs.appendChild(mask);
      defs.querySelector('#letters').appendChild(el('path', { d }));
      const glyph = el('path', { d, class: 'glyph', mask: `url(#pen-${i})` });
      ink.appendChild(glyph);
      return { glyph, mask: `url(#pen-${i})`, pens };
    });

    SPARKS.forEach(([x, y, size, every], n) => {
      const spot = el('g', { transform: `translate(${x} ${y})`, class: every ? 'again' : '' });
      // 8 rays, alternating long and short, turned a little differently each time.
      for (let k = 0; k < 8; k++) {
        const a = (k / 8 + n * 0.07) * 2 * Math.PI;
        const [from, to] = k % 2 ? [size * 0.45, size * 0.8] : [size * 0.35, size];
        const [cx, cy] = [Math.cos(a), Math.sin(a)];
        spot.appendChild(el('path', {
          class: 'ray', pathLength: 1,
          d: `M${(cx * from).toFixed(2)} ${(cy * from).toFixed(2)}L${(cx * to).toFixed(2)} ${(cy * to).toFixed(2)}`,
        }));
      }
      // Burst in step with the sweep moving left to right.
      spot.style.setProperty('--delay', `${Math.round(150 + x * 3.4)}ms`);
      if (every) spot.style.setProperty('--every', `${every}ms`);
      sparkles.appendChild(spot);
    });

    // The pen speeds up mid-stroke and slows into the end, like a real hand.
    const easeInOut = t => -(Math.cos(Math.PI * t) - 1) / 2;
    let frame;

    function reset() {
      cancelAnimationFrame(frame);
      svg.classList.remove('shine');
      letters.forEach(({ glyph, mask, pens }) => {
        glyph.setAttribute('mask', mask);
        pens.forEach(({ pen, length }) => { pen.style.strokeDashoffset = length; });
      });
    }

    function write() {
      reset();
      const timeline = [];
      let t = START_DELAY;
      letters.forEach((letter, i) => {
        letter.pens.forEach((stroke, j) => {
          if (j > 0) t += STROKE_GAP;
          const duration = Math.max(stroke.length * MS_PER_UNIT, 220);
          timeline.push({ ...stroke, letter, start: t, duration, last: j === letter.pens.length - 1 });
          t += duration;
        });
        t += LETTER_GAP;
      });

      const begin = performance.now();
      const tick = now => {
        const elapsed = now - begin;
        let finished = true;
        for (const s of timeline) {
          const p = Math.min(Math.max((elapsed - s.start) / s.duration, 0), 1);
          s.pen.style.strokeDashoffset = s.length * (1 - easeInOut(p));
          if (p < 1) finished = false;
          // Once a letter is fully written, drop its mask so it renders crisp.
          else if (s.last) s.letter.glyph.removeAttribute('mask');
        }
        if (finished) svg.classList.add('shine');
        else frame = requestAnimationFrame(tick);
      };
      frame = requestAnimationFrame(tick);
    }

    // Scroll turns the page from dark to light, eased at both ends.
    const scene = document.querySelector('.scene');
    let toneQueued = false;
    function updateTone() {
      toneQueued = false;
      const range = scene.offsetHeight - innerHeight;
      const p = range > 0 ? Math.min(Math.max(scrollY / range, 0), 1) : 0;
      document.documentElement.style.setProperty('--tone', (p * p * (3 - 2 * p)).toFixed(4));
    }
    const queueTone = () => {
      if (!toneQueued) { toneQueued = true; requestAnimationFrame(updateTone); }
    };
    addEventListener('scroll', queueTone, { passive: true });
    addEventListener('resize', queueTone);
    updateTone();

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      letters.forEach(({ glyph }) => glyph.removeAttribute('mask'));
    } else {
      write();
      svg.addEventListener('click', write);
    }
  </script>
</body>
</html>
